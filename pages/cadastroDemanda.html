<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../styles/global.css" />
        <link rel="stylesheet" href="../styles/cadastroDemanda.css" />

        <link rel="shortcut icon" href="../imgs/ico/demandly_ico.ico" type="image/x-icon" />
        <title>Cadastro/Edição Demandas | Demandly</title>
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <a href="dashboard.html">
                    <img src="../imgs/logos/demandly_logo_white.webp" alt="Demandly Logo" />
                </a>
            </div>

            <div class="nav-container">
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="listagemDemanda.html">Listagem de Demandas</a>
                    <a href="cadastroDemanda.html">Cadastro/Edição de Demanda</a>
                </nav>
            </div>

            <div class="perfil-container">
                <a href="#perfil">
                    <img
                        src="https://i.pinimg.com/736x/32/9b/54/329b54d07444f009b0634f438db9a449.jpg"
                        alt="Foto de Perfil"
                    />
                </a>
            </div>
        </header>

        <main class="main-content">
            <section class="form-container">
                <div class="form-header">
                    <h2 id="titulo-formulario">Cadastrar Nova Demanda</h2>
                    <p id="subtitulo-formulario">
                        Preencha os campos abaixo para registrar a demanda no sistema.
                    </p>
                </div>

                <form action="#" method="POST" id="demanda-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="titulo"
                                >Título da Demanda <span class="required">*</span></label
                            >
                            <input
                                type="text"
                                id="titulo"
                                name="titulo"
                                placeholder="Ex: Criação de nova landing page"
                                required
                            />
                        </div>
                    </div>

                    <div class="form-row multiple-columns">
                        <div class="form-group">
                            <label for="categoria">Categoria <span class="required">*</span></label>
                            <select id="categoria" name="categoria" required>
                                <option value="" disabled selected>
                                    Selecione uma categoria...
                                </option>
                                <option value="desenvolvimento">Desenvolvimento</option>
                                <option value="design">Design</option>
                                <option value="marketing">Marketing</option>
                                <option value="suporte">Suporte</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="prioridade">Prioridade</label>
                            <select id="prioridade" name="prioridade">
                                <option value="baixa">Baixa</option>
                                <option value="media" selected>Média</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="prazo">Prazo Limite</label>
                            <input type="date" id="prazo" name="prazo" />
                        </div>

                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option value="pendente">Pendente</option>
                                <option value="em-andamento">Em Andamento</option>
                                <option value="concluida">Concluída</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="descricao"
                                >Descrição Detalhada <span class="required">*</span></label
                            >
                            <textarea
                                id="descricao"
                                name="descricao"
                                rows="6"
                                placeholder="Descreva o que precisa ser feito com o máximo de detalhes..."
                                required
                            ></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btn-submit">
                            Salvar Demanda
                        </button>
                    </div>
                </form>
            </section>

            <section class="form-container">
                <div class="form-header">
                    <!-- Títulos alterados para o contexto de Edição -->
                    <h2 id="titulo-formulario">Editar Demanda #0042</h2>
                    <p id="subtitulo-formulario">Atualize as informações da demanda abaixo.</p>
                </div>

                <form action="#" method="POST" id="demanda-form-edicao">
                    <!-- NOVA LINHA: Campos exclusivos de edição (Bloqueados) -->
                    <div class="form-row multiple-columns">
                        <div class="form-group">
                            <label for="id-demanda">ID da Demanda</label>
                            <!-- Usando a classe campo-bloqueado e o atributo readonly -->
                            <input
                                type="text"
                                id="id-demanda"
                                value="#0042"
                                class="campo-bloqueado"
                                readonly
                            />
                        </div>

                        <div class="form-group">
                            <label for="data-criacao">Data de Criação</label>
                            <!-- Usando a classe campo-bloqueado e o atributo readonly -->
                            <input
                                type="text"
                                id="data-criacao"
                                value="28/08/2026"
                                class="campo-bloqueado"
                                readonly
                            />
                        </div>
                    </div>

                    <!-- Campos normais editáveis (mesmo padrão da criação) -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="titulo"
                                >Título da Demanda <span class="required">*</span></label
                            >
                            <!-- O input normal usa o value="" para trazer o dado do banco -->
                            <input
                                type="text"
                                id="titulo"
                                name="titulo"
                                value="Ajustar responsividade da Home"
                                required
                            />
                        </div>
                    </div>

                    <div class="form-row multiple-columns">
                        <div class="form-group">
                            <label for="categoria">Categoria <span class="required">*</span></label>
                            <select id="categoria" name="categoria" required>
                                <!-- A opção correspondente vem com 'selected' -->
                                <option value="desenvolvimento" selected>Desenvolvimento</option>
                                <option value="design">Design</option>
                                <option value="marketing">Marketing</option>
                                <option value="suporte">Suporte</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option value="pendente">Pendente</option>
                                <option value="em-andamento" selected>Em Andamento</option>
                                <option value="concluida">Concluída</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="descricao"
                                >Descrição Detalhada <span class="required">*</span></label
                            >
                            <textarea id="descricao" name="descricao" rows="6" required>
O menu superior está quebrando em telas menores que 768px. Precisamos ajustar o Flexbox do header.</textarea
                            >
                        </div>
                    </div>

                    <div class="form-actions">
                        <!-- Em uma edição, podemos ter um botão de deletar (opcional) -->
                        <button
                            type="button"
                            class="btn btn-secondary"
                            style="
                                margin-right: auto;
                                color: var(--btn-danger-normal);
                                border-color: var(--btn-danger-normal);
                            "
                        >
                            Excluir Demanda
                        </button>

                        <button type="button" class="btn btn-secondary">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btn-submit">
                            Salvar Alterações
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
