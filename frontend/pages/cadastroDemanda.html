<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../styles/global.css" />
        <link rel="stylesheet" href="../styles/cadastroDemanda.css" />

        <link rel="shortcut icon" href="../imgs/ico/demandly_ico.ico" type="image/x-icon" />
        <title>Cadastro/Edição Demandas | Demandly</title>

        <script src="../scripts/cadastroDemanda.js" defer></script>
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <a href="dashboard.html">
                    <img src="../imgs/logos/demandly_logo_white.webp" alt="Demandly Logo" />
                </a>
            </div>

            <div class="nav-container">
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="listagemDemanda.html">Listagem de Demandas</a>
                    <a href="cadastroDemanda.html">Cadastro/Edição de Demanda</a>
                </nav>
            </div>

            <div class="perfil-container">
                <a href="#perfil">
                    <img
                        src="https://i.pinimg.com/736x/32/9b/54/329b54d07444f009b0634f438db9a449.jpg"
                        alt="Foto de Perfil"
                    />
                </a>
            </div>
        </header>

        <main class="main-content">
            <section class="form-container">
                <div class="form-header">
                    <h2 id="titulo-formulario">Cadastrar Nova Demanda</h2>
                    <p id="subtitulo-formulario">
                        Preencha os campos abaixo para registrar a demanda no sistema.
                    </p>
                </div>

                <form id="demanda-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="titulo">Título da Demanda <span class="required">*</span></label>
                            <input
                                type="text"
                                id="titulo"
                                name="titulo"
                                placeholder="Ex: Criação de nova landing page"
                                required
                            />
                            <span class="error-msg" id="erro-titulo"></span>
                        </div>
                    </div>

                    <div class="form-row multiple-columns">
                        <!-- 1. Tipo da Demanda (Coerente com o CHECK do Oracle) -->
                        <div class="form-group">
                            <label for="tipo">Tipo da Demanda <span class="required">*</span></label>
                            <select id="tipo" name="tipo" required>
                                <option value="" disabled selected>Selecione um tipo...</option>
                                <option value="Tarefa">Tarefa</option>
                                <option value="Defeito">Defeito</option>
                                <option value="Melhoria">Melhoria</option>
                                <option value="Documentação">Documentação</option>
                            </select>
                            <span class="error-msg" id="erro-tipo"></span>
                        </div>

                        <!-- 2. Prioridade (Coerente com o CHECK do Oracle) -->
                        <div class="form-group">
                            <label for="prioridade">Prioridade <span class="required">*</span></label>
                            <select id="prioridade" name="prioridade" required>
                                <option value="" disabled selected>Selecione a prioridade...</option>
                                <option value="Crítica">Crítica</option>
                                <option value="Alta">Alta</option>
                                <option value="Média">Média</option>
                                <option value="Baixa">Baixa</option>
                            </select>
                            <span class="error-msg" id="erro-prioridade"></span>
                        </div>

                        <!-- 3. Projeto Vinculado (Preenchido dinamicamente via GET /projetos) -->
                        <div class="form-group">
                            <label for="id_projeto">Projeto Vinculado <span class="required">*</span></label>
                            <select id="id_projeto" name="id_projeto" required>
                                <option value="" disabled selected>Carregando projetos...</option>
                            </select>
                            <span class="error-msg" id="erro-projeto"></span>
                        </div>

                        <!-- 4. Responsável (Opcional ou preenchido dinamicamente) -->
                        <div class="form-group">
                            <label for="id_responsavel">Responsável</label>
                            <select id="id_responsavel" name="id_responsavel">
                                <option value="" selected>Sem responsável (Opcional)</option>
                                <!-- Se preferir carregar da API de usuários, o JS pode injetar aqui -->
                            </select>
                            <span class="error-msg" id="erro-responsavel"></span>
                        </div>

                        <!-- 5. Prazo de Finalização -->
                        <div class="form-group">
                            <label for="prazo_finalizacao">Prazo de Finalização <span class="required">*</span></label>
                            <input type="date" id="prazo_finalizacao" name="prazo_finalizacao" required />
                            <span class="error-msg" id="erro-prazo"></span>
                        </div>
                        
                        <!-- 6. Status Inicial (Definido automaticamente como Aberta) -->
                        <div class="form-group">
                            <label for="status">Status Inicial</label>
                            <input type="text" id="status" name="status" value="Aberta" disabled style="background-color: #f1f1f1; cursor: not-allowed;" />
                            <span class="error-msg" id="erro-status"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="descricao">Descrição Detalhada <span class="required">*</span></label>
                            <textarea
                                id="descricao"
                                name="descricao"
                                rows="6"
                                placeholder="Descreva o que precisa ser feito com o máximo de detalhes..."
                                required
                            ></textarea>
                            <span class="error-msg" id="erro-descricao"></span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btn-submit">
                            Salvar Demanda
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
