<!--
    Feito por Rafael França Cardoso

    Esta página é responsável pela listagem de demandas do sistema.

    Cabeçalho:
    Exibe o logo, menu de navegação e perfil do usuário.

    Filtros:
    Permite pesquisar e filtrar demandas por status, prioridade e tipo.

    Ordenação:
    Permite organizar as demandas por prioridade, data de criação,
    prazo de finalização ou status.

    Tabela:
    Exibe as informações das demandas cadastradas e suas ações.

    Paginação:
    Exibe qual página e quantas demandas há.

    Mensagem:
    Exibe uma mensagem quando nenhuma demanda é encontrada.
-->

<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../styles/global.css" />
        <link rel="stylesheet" href="../styles/listagemDemanda.css" />

        <link rel="shortcut icon" href="../imgs/ico/demandly_ico.ico" type="image/x-icon" />
        <title>Listagem de Demandas| Demandly</title>

        <script src="../scripts/listagemDemanda.js" defer></script>
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <a href="dashboard.html"
                    ><img src="../imgs/logos/demandly_logo_white.webp" alt=""
                /></a>
            </div>

            <div class="nav-container">
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="listagemDemanda.html">Listagem de Demandas</a>
                    <a href="cadastroDemanda.html">Cadastro/Edição de Demanda</a>
                </nav>
            </div>

            <div class="perfil-container">
                <a href="#perfil"
                    ><img
                        src="https://i.pinimg.com/736x/32/9b/54/329b54d07444f009b0634f438db9a449.jpg"
                        alt=""
                /></a>
            </div>
        </header>

        <div class="container">
            <div class="topo-pagina">
                <div>
                    <h1>Listagem de Demandas</h1>
                    <p>Visualize e acompanhe todas as demandas cadastradas.</p>
                </div>

                <a href="cadastroDemanda.html" class="btn-nova-demanda">+ Nova Demanda</a>
            </div>

            <div class="filtros">
                <div class="campo-busca">
                    <input type="text" id="busca" placeholder="Pesquisar demanda..." />
                </div>

                <div class="campo-filtro">
                    <label>Tipo</label>

                    <select id="tipo">
                        <option>Todos</option>
                        <option>Tarefa</option>
                        <option>Defeito</option>
                        <option>Melhoria</option>
                        <option>Documentação</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label>Prioridade</label>

                    <select id="prioridade">
                        <option>Todas</option>
                        <option>Crítica</option>
                        <option>Alta</option>
                        <option>Média</option>
                        <option>Baixa</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label>Status</label>

                    <select id="status">
                        <option>Todos</option>
                        <option>Aberta</option>
                        <option>Em andamento</option>
                        <option>Em revisão</option>
                        <option>Concluída</option>
                        <option>Cancelada</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label>Ordenar por</label>
                    <select id="ordenacao">
                        <option value="nenhuma">Nenhuma</option>
                        <option value="prioridade">Prioridade</option>
                        <option value="status">Status</option>
                        <option value="criacao">Data de criação</option>
                        <option value="prazo">Prazo de finalização</option>
                    </select>
                </div>

                <button type="button" id="btn-filtrar">Filtrar</button>
            </div>

            <div class="area-resetar">
                <button type="button" id="btn-resetar">Limpar filtros</button>
            </div>

            <p id="mensagem-erro" role="alert"></p>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Tipo</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Projeto</th>
                            <th>Responsável</th>
                            <th>Criação</th>
                            <th>Prazo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-demandas">
                    </tbody>
                    
                </table>

                <p id="sem-resultados">Nenhuma demanda encontrada.</p>

                <div class="paginacao">
                    <button id="pagina-anterior" disabled>Anterior</button>

                    <span id="informacao-paginacao">Página 1</span>

                    <button id="proxima-pagina">Próxima</button>
                </div> 

            </div>
        </div>
    </body>
</html>
