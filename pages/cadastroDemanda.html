<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../styles/global.css" />
        <link rel="stylesheet" href="../styles/cadastroDemanda.css" />

        <link rel="shortcut icon" href="../imgs/ico/demandly_ico.ico" type="image/x-icon" />
        <title>Cadastro/Edição Demandas | Demandly</title>
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <a href="dashboard.html">
                    <img src="../imgs/logos/demandly_logo_white.webp" alt="Demandly Logo" />
                </a>
            </div>

            <div class="nav-container">
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="listagemDemanda.html">Listagem de Demandas</a>
                    <a href="cadastroDemanda.html">Cadastro/Edição de Demanda</a>
                    <a href="detalhesDemanda.html">Detalhes da Demanda</a>
                </nav>
            </div>

            <div class="perfil-container">
                <a href="#perfil">
                    <img
                        src="https://i.pinimg.com/736x/32/9b/54/329b54d07444f009b0634f438db9a449.jpg"
                        alt="Foto de Perfil"
                    />
                </a>
            </div>
        </header>

        <main class="main-content">
            <section class="form-container">
                <div class="form-header">
                    <h2>Cadastrar Nova Demanda</h2>
                    <p>Preencha os campos abaixo para registrar a demanda no sistema.</p>
                </div>

                <form action="#" method="POST" id="demanda-form">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="titulo">Título da Demanda <span class="required">*</span></label>
                            <input type="text" id="titulo" name="titulo" placeholder="Ex: Criação de nova landing page" required />
                        </div>
                    </div>

                    <div class="form-row multiple-columns">
                        <div class="form-group">
                            <label for="categoria">Categoria <span class="required">*</span></label>
                            <select id="categoria" name="categoria" required>
                                <option value="" disabled selected>Selecione uma categoria...</option>
                                <option value="desenvolvimento">Desenvolvimento</option>
                                <option value="design">Design</option>
                                <option value="marketing">Marketing</option>
                                <option value="suporte">Suporte</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="prioridade">Prioridade</label>
                            <select id="prioridade" name="prioridade">
                                <option value="baixa">Baixa</option>
                                <option value="media" selected>Média</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="prazo">Prazo Limite</label>
                            <input type="date" id="prazo" name="prazo" />
                        </div>
                        
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option value="pendente">Pendente</option>
                                <option value="em-andamento">Em Andamento</option>
                                <option value="concluida">Concluída</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="descricao">Descrição Detalhada <span class="required">*</span></label>
                            <textarea id="descricao" name="descricao" rows="6" placeholder="Descreva o que precisa ser feito com o máximo de detalhes..." required></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='listagemDemanda.html'">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Demanda</button>
                    </div>

                </form>
            </section>
        </main>
        </body>
</html>
